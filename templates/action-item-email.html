<div style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#222;">
  <p>Hi ${OwnerFirstName},</p>
  <p>You have a new action item from <strong>${ProjectName}</strong>:</p>
  <table style="border-collapse:collapse;">
    <tr><td style="padding:4px 12px 4px 0;color:#666;">Action</td><td style="padding:4px 0;"><strong>${Title}</strong></td></tr>
    <tr><td style="padding:4px 12px 4px 0;color:#666;">Due</td><td style="padding:4px 0;">${DueText}</td></tr>
    <tr><td style="padding:4px 12px 4px 0;color:#666;">Priority</td><td style="padding:4px 0;">${Priority}</td></tr>
  </table>
  <p>${Details}</p>
  <p><a href="${ItemLink}">Open the action item</a> to update its status.</p>
  <p style="color:#888;font-size:12px;">Sent by MinuteMate. Reply to the project owner if this isn't yours.</p>
</div>
